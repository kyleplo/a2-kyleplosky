<!doctype html>
<html lang='en'>
  <head>
    <title>The Honey-Dirt Question</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src='js/main.js'></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='css/main.css'>
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
  </head>
  <body>
    <header>
      <h1>The Honey-Dirt Question</h1>
      <p>You are a train driver.&nbsp;Would you rather your train suddenly become filled with honey or dirt?</p>
    </header>
    <section class="honey">
      <h2>Honey</h2>
      <p class="count" id="honeyCount"></p>
      <form>
        <input type="hidden" name="id">
        <input type="hidden" name="vote" value="honey">
        <button>
          Vote for Honey
        </button>
      </form>
      <ul id="honeyVoteList"></ul>
    </section>
    <section class="dirt">
      <h2>Dirt</h2>
      <p class="count" id="dirtCount"></p>
      <form>
        <input type="hidden" name="id">
        <input type="hidden" name="vote" value="dirt">
        <button>
          Vote for Dirt
        </button>
      </form>
      <ul id="dirtVoteList"></ul>
    </section>
  </body>
</html>
